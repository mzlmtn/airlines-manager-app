<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AM Akıllı Filo</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --input-bg: #2a2a2a;
            --accent: #ff4b4b;
            --success: #00d26a;
            --success-muted: #55d288;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border: #333333;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 15px; margin: 0; padding-bottom: 50px; }
        h2, h3, h4 { margin-top: 0; color: #f0f0f0; }
        
        /* Sekme Tasarımı */
        .tab-container { display: flex; margin-bottom: 20px; background-color: var(--card-bg); border-radius: 10px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 15px; text-align: center; background: none; border: none; color: var(--text-muted); font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background-color: var(--input-bg); color: var(--text-main); border-bottom: 3px solid var(--accent); }
        
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
        
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--input-bg); color: white; box-sizing: border-box; font-size: 16px; margin-bottom: 10px;}
        input:focus { outline: none; border-color: var(--accent); }
        
        .btn-main { width: 100%; padding: 16px; border-radius: 10px; border: none; background-color: var(--accent); color: white; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(255, 75, 75, 0.3);}
        .btn-main:active { background-color: #d43f3f; transform: scale(0.98); }
        
        .text-success { color: var(--success); }
        .text-danger { color: var(--accent); }
        .text-info { color: #5bc0de; }
        .text-muted { color: var(--text-muted); font-size: 13px; }
        .divider { border-bottom: 1px solid var(--border); margin: 15px 0; }
        
        /* Finansal Özet Kartı */
        .summary-box { text-align: center; padding: 15px; background-color: var(--input-bg); border-radius: 8px; margin-bottom: 10px;}
        .summary-box h4 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 13px;}
        .summary-box h2 { margin: 0; font-size: 22px;}
        
        /* Expander (Açılır Kapanır Detaylar) */
        details { background-color: var(--input-bg); border-radius: 10px; padding: 10px 15px; margin-bottom: 10px; border: 1px solid var(--border); }
        summary { font-weight: bold; font-size: 15px; cursor: pointer; outline: none; display: flex; align-items: center; justify-content: space-between; padding-bottom: 5px;}
        summary::-webkit-details-marker { display: none; }
        .details-content { margin-top: 15px; font-size: 14px; border-top: 1px solid var(--border); padding-top: 15px;}
        .stat-list { list-style: none; padding: 0; margin: 0; }
        .stat-list li { margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="tab-container">
        <button class="tab-btn active">Hesaplayıcı</button>
        <button class="tab-btn" onclick="alert('Rotalarım veritabanı bir sonraki güncellemede bu sekmeye eklenecektir.')">Rotalarım</button>
    </div>

    <div class="card">
        <h3>📍 Rota ve Konfor</h3>
        <div class="grid-2">
            <div><label>Uzaklık (km)</label><input type="number" id="dist" value="8000" oninput="saveData(); calcPrices();"></div>
            <div><label>Comfort İstatistiği</label><input type="number" id="comf" value="0" oninput="saveData(); calcPrices();"></div>
        </div>
        <div class="divider"></div>
        <h3>🏷️ Bilet Fiyatları (Otomatik)</h3>
        <div class="grid-4">
            <div><label>Eco ($)</label><input type="number" id="p_e" readonly></div>
            <div><label>Bus ($)</label><input type="number" id="p_b" readonly></div>
            <div><label>First ($)</label><input type="number" id="p_f" readonly></div>
            <div><label>Cargo ($)</label><input type="number" id="p_c" readonly></div>
        </div>
    </div>

    <div class="card">
        <h3>👥 Günlük Brüt Demand</h3>
        <div class="grid-4">
            <div><label>Eco</label><input type="number" id="d_e" value="0" oninput="saveData()"></div>
            <div><label>Bus</label><input type="number" id="d_b" value="0" oninput="saveData()"></div>
            <div><label>First</label><input type="number" id="d_f" value="0" oninput="saveData()"></div>
            <div><label>Cargo</label><input type="number" id="d_c" value="0" oninput="saveData()"></div>
        </div>
    </div>

    <button class="btn-main" onclick="calculate()">Filoyu Optimize Et</button>

    <div id="results"></div>

<script>
    // Genişletilmiş Uçak Veritabanı
    const AIRCRAFT_DB = [
        {name: "Airbus A380-800", range: 15556, speed: 903, seats: 853, cargo: 84, price: 403000000, fuel: 2.05, wear: 1.2, other: 0.10},
        {name: "Boeing 747-8I", range: 14815, speed: 911, seats: 605, cargo: 76, price: 379100000, fuel: 2.11, wear: 1.4, other: 0.12},
        {name: "Boeing 747-400", range: 13450, speed: 903, seats: 660, cargo: 65, price: 296300000, fuel: 2.65, wear: 2.1, other: 0.02},
        {name: "Boeing 777-300ER", range: 14685, speed: 898, seats: 550, cargo: 71, price: 330000000, fuel: 2.10, wear: 1.5, other: 0.08},
        {name: "Boeing 777-200ER", range: 14305, speed: 898, seats: 440, cargo: 59, price: 261500000, fuel: 2.40, wear: 1.8, other: 0.05},
        {name: "Airbus A350-1000", range: 14750, speed: 903, seats: 475, cargo: 54, price: 335000000, fuel: 1.65, wear: 1.1, other: 0.18},
        {name: "Airbus A350-900XWB", range: 15000, speed: 903, seats: 440, cargo: 45, price: 295200000, fuel: 1.70, wear: 1.1, other: 0.18},
        {name: "Boeing 787-9", range: 14140, speed: 911, seats: 420, cargo: 34, price: 264600000, fuel: 1.80, wear: 1.1, other: 0.18},
        {name: "Boeing 787-8", range: 13620, speed: 911, seats: 381, cargo: 28, price: 206800000, fuel: 1.85, wear: 1.1, other: 0.18},
        {name: "Airbus A330-900neo", range: 13334, speed: 880, seats: 440, cargo: 45, price: 272000000, fuel: 1.95, wear: 1.3, other: 0.15},
        {name: "Airbus A330-300", range: 11750, speed: 880, seats: 440, cargo: 45, price: 239400000, fuel: 2.30, wear: 1.8, other: 0.04},
        {name: "Boeing 767-300ER", range: 11070, speed: 850, seats: 350, cargo: 38, price: 182800000, fuel: 2.50, wear: 2.0, other: 0.01},
        {name: "Boeing 737-700ER", range: 10200, speed: 850, seats: 149, cargo: 15, price: 81000000, fuel: 2.60, wear: 1.7, other: 0.02},
        {name: "Airbus A310-300", range: 9540, speed: 850, seats: 275, cargo: 33, price: 157300000, fuel: 2.70, wear: 2.2, other: 0.01},
        {name: "Boeing 757-200", range: 7222, speed: 850, seats: 239, cargo: 25, price: 85000000, fuel: 2.55, wear: 1.9, other: 0.02},
        {name: "Airbus A321-200neo-LR", range: 7408, speed: 840, seats: 244, cargo: 5, price: 131500000, fuel: 1.90, wear: 1.2, other: 0.15},
        {name: "Boeing 737 MAX 9", range: 6574, speed: 839, seats: 220, cargo: 6, price: 116600000, fuel: 1.95, wear: 1.2, other: 0.15}
    ].sort((a, b) => b.seats - a.seats);

    const AVG_FUEL_PRICE = 750; // Ortalama oyun içi yakıt fiyatı
    const ESTIMATED_TAX_RATE = 0.12;

    // Sayfa yüklendiğinde hafızadaki verileri çek
    window.onload = function() {
        let hasData = false;
        ['dist', 'comf', 'd_e', 'd_b', 'd_f', 'd_c'].forEach(id => {
            if(localStorage.getItem(id) !== null) {
                document.getElementById(id).value = localStorage.getItem(id);
                hasData = true;
            }
        });
        calcPrices();
        // Eğer daha önceden girilmiş bir mesafe varsa direkt hesapla
        if(hasData && parseFloat(document.getElementById('dist').value) > 0) {
            calculate();
        }
    };

    // Her tuşlamada verileri telefona kaydet
    function saveData() {
        ['dist', 'comf', 'd_e', 'd_b', 'd_f', 'd_c'].forEach(id => {
            localStorage.setItem(id, document.getElementById(id).value);
        });
    }

    function calcPrices() {
        let dist = parseFloat(document.getElementById('dist').value) || 0;
        let comf = parseFloat(document.getElementById('comf').value) || 0;
        let multi = 1 + (comf / 3000);
        
        document.getElementById('p_e').value = Math.floor(120 + (dist * 0.2639) * multi);
        document.getElementById('p_b').value = Math.floor(160 + (dist * 0.3509) * multi);
        document.getElementById('p_f').value = Math.floor(276 + (dist * 0.6068) * multi);
        
        let c_coef = dist >= 5000 ? 0.47 : (dist >= 2000 ? 0.52 : 0.56);
        document.getElementById('p_c').value = Math.floor(200 + (dist * c_coef));
    }

    function formatMoney(n) {
        return "$" + Math.round(n).toLocaleString('en-US');
    }

    function calculate() {
        saveData();
        let dist = parseFloat(document.getElementById('dist').value) || 0;
        let d_e = parseFloat(document.getElementById('d_e').value) || 0;
        let d_b = parseFloat(document.getElementById('d_b').value) || 0;
        let d_f = parseFloat(document.getElementById('d_f').value) || 0;
        let d_c = parseFloat(document.getElementById('d_c').value) || 0;

        let p_e = parseFloat(document.getElementById('p_e').value) || 0;
        let p_b = parseFloat(document.getElementById('p_b').value) || 0;
        let p_f = parseFloat(document.getElementById('p_f').value) || 0;
        let p_c = parseFloat(document.getElementById('p_c').value) || 0;

        let resDiv = document.getElementById('results');
        resDiv.innerHTML = "";

        let available = AIRCRAFT_DB.filter(p => p.range >= dist);
        if(available.length === 0) {
            resDiv.innerHTML = `<div class="card text-danger"><b>Hata:</b> ${dist} km menzile yetecek uçak veritabanında bulunamadı.</div>`;
            return;
        }

        let c_e = Math.ceil(d_e / 2) * 7;
        let c_b = Math.ceil(d_b / 2) * 7;
        let c_f = Math.ceil(d_f / 2) * 7;
        let c_c = Math.ceil(d_c / 2) * 7;

        let fleet = [];
        let cost = 0, gross_wk = 0, net_wk = 0;
        let loopSafe = 0;

        while(true) {
            loopSafe++; if(loopSafe > 50) break; // Kilitlenme koruması
            
            let total_d = c_e + (c_b * 2) + (c_f * 4);
            if(total_d <= 0 && c_c <= 0) break;

            let chosen = null, chosen_flights = 1;

            for(let p of available) {
                let rt_time = (dist * 2) / p.speed || 1;
                let wk_flights = Math.max(1, Math.floor(168 / rt_time));
                if (p.seats * wk_flights <= total_d) {
                    chosen = p; chosen_flights = wk_flights; break;
                }
            }

            if(!chosen) {
                let p = available[available.length - 1];
                let rt_time = (dist * 2) / p.speed || 1;
                let wk_flights = Math.max(1, Math.floor(168 / rt_time));
                if (total_d < (p.seats * wk_flights) * 0.65) {
                    break;
                } else {
                    chosen = p; chosen_flights = wk_flights;
                }
            }

            let rem = chosen.seats;
            let conf = {name: chosen.name, E:0, B:0, F:0, C:0, flights: chosen_flights, stats: chosen};

            conf.F = Math.min(Math.ceil(c_f / chosen_flights), Math.floor(rem / 4));
            c_f = Math.max(0, c_f - (conf.F * chosen_flights));
            rem -= conf.F * 4;

            conf.B = Math.min(Math.ceil(c_b / chosen_flights), Math.floor(rem / 2));
            c_b = Math.max(0, c_b - (conf.B * chosen_flights));
            rem -= conf.B * 2;

            conf.E = Math.min(Math.ceil(c_e / chosen_flights), rem);
            c_e = Math.max(0, c_e - (conf.E * chosen_flights));
            rem -= conf.E;

            if(rem > 0) {
                conf.E += rem;
                c_e = Math.max(0, c_e - (rem * chosen_flights));
            }

            conf.C = Math.min(Math.ceil(c_c / chosen_flights), chosen.cargo);
            c_c = Math.max(0, c_c - (conf.C * chosen_flights));

            let total_pax = conf.E + conf.B + conf.F;
            let used_seats = (conf.F * 4) + (conf.B * 2) + conf.E;
            conf.fill_rate = (used_seats / chosen.seats) * 100;
            
            let rt_time = (dist * 2) / chosen.speed;
            conf.use_rate = ((chosen_flights * rt_time) / 168) * 100;
            let wk_hours = chosen_flights * rt_time;
            
            let wk_rev = ((conf.E*p_e) + (conf.B*p_b) + (conf.F*p_f) + (conf.C*p_c)) * chosen_flights;
            
            let fuel_cost = ((dist*2)/100) * chosen.fuel * total_pax * chosen_flights * (AVG_FUEL_PRICE/1000);
            let tax = chosen_flights * (dist >= 5000 ? 70000 : 40000);
            let other = wk_rev * chosen.other;
            let maint = (chosen.wear / 100) * (wk_hours / 100) * (chosen.price * 0.01);
            
            conf.wk_gross = wk_rev;
            conf.wk_net = wk_rev - fuel_cost - tax - other;
            
            conf.fuel_c = fuel_cost;
            conf.tax_c = tax + other;
            conf.maint_c = maint;
            
            conf.hr_profit = wk_hours > 0 ? conf.wk_net / wk_hours : 0;
            conf.fl_profit = chosen_flights > 0 ? conf.wk_net / chosen_flights : 0;
            conf.roi = conf.wk_net > 0 ? chosen.price / conf.wk_net : 0;
            
            cost += chosen.price;
            gross_wk += conf.wk_gross;
            net_wk += conf.wk_net;

            fleet.push(conf);
        }

        if(fleet.length === 0) {
            resDiv.innerHTML = `<div class="card text-info">Atanacak yeterli demand yok. Yeni uçak ataması zarar ettireceği için durduruldu.</div>`;
            return;
        }

        let gross_day = gross_wk / 7;
        let net_day = net_wk / 7;

        let html = `
        <div class="card" style="text-align: center;">
            <div class="summary-box">
                <h4>💸 Toplam Filo Maliyeti</h4>
                <h2 class="text-danger">${formatMoney(cost)}</h2>
            </div>
            <div class="divider"></div>
            <div class="grid-2">
                <div>
                    <h4 class="text-muted" style="margin-bottom:5px;">Brüt Gelir</h4>
                    <div style="font-size:20px; font-weight:bold;">${formatMoney(gross_wk)}</div>
                    <div class="text-muted">(Gnlk: ${formatMoney(gross_day)})</div>
                </div>
                <div>
                    <h4 class="text-muted" style="margin-bottom:5px;">Oyun İçi Net Kâr</h4>
                    <div class="text-success" style="font-size:20px; font-weight:bold;">${formatMoney(net_wk)}</div>
                    <div style="color:var(--success-muted); font-size:13px;">(Gnlk: ${formatMoney(net_day)})</div>
                </div>
            </div>
            <div style="margin-top:15px; font-size:13px; color:#888;">
                ⏱️ Ortalama Amortisman: ${(cost/net_wk).toFixed(1)} Hafta
            </div>
        </div>`;

        fleet.forEach((f, i) => {
            html += `
            <details>
                <summary>
                    <div>✈️ ${i+1}. Uçak: ${f.name} <span class="text-muted" style="font-size:12px; font-weight:normal;">(Doluluk: %${f.fill_rate.toFixed(1)})</span></div>
                    <span style="font-size: 14px;">➕</span>
                </summary>
                
                <div class="details-content">
                    <div style="margin-bottom: 12px; font-size: 14px; line-height: 1.6;">
                        <b>Fiyat:</b> ${formatMoney(f.stats.price)} &nbsp;|&nbsp; 
                        <b>Hft. Net:</b> <span class="text-success" style="font-weight:bold;">${formatMoney(f.wk_net)}</span> 
                        <span class="text-muted">(Gnlk: ${formatMoney(f.wk_net/7)})</span> &nbsp;|&nbsp; 
                        <b>Amortisman:</b> ${f.roi > 0 ? f.roi.toFixed(1) + ' Hft' : '-'}
                    </div>
                    
                    <div class="grid-2" style="margin-bottom:10px;">
                        <div>
                            <span class="text-muted">💺 Konfigürasyon</span>
                            <ul class="stat-list">
                                <li>Eco: <b>${f.E}</b></li>
                                <li>Bus: <b>${f.B}</b></li>
                                <li>First: <b>${f.F}</b></li>
                                <li>Cargo: <b>${f.C}</b></li>
                            </ul>
                        </div>
                        <div>
                            <span class="text-muted">🔄 Operasyon</span>
                            <ul class="stat-list">
                                <li>Sefer: <b>${f.flights}</b></li>
                                <li>Süre: <b>${((dist*2)/f.stats.speed).toFixed(1)}s</b></li>
                                <li>Kullanım: <b>%${f.use_rate.toFixed(1)}</b></li>
                            </ul>
                        </div>
                    </div>
                    
                    <div class="grid-2">
                        <div>
                            <span class="text-muted">💸 Giderler (Haftalık)</span>
                            <ul class="stat-list">
                                <li>Yakıt: <b>${formatMoney(f.fuel_c)}</b></li>
                                <li>Uçuş/Vergi: <b>${formatMoney(f.tax_c)}</b></li>
                                <li>Bakım(Wear): <b>${formatMoney(f.maint_c)}</b></li>
                            </ul>
                        </div>
                        <div>
                            <span class="text-muted">📊 Performans</span>
                            <ul class="stat-list">
                                <li>Seferlik Kâr: <b>${formatMoney(f.fl_profit)}</b></li>
                                <li>Saatlik Kâr: <b>${formatMoney(f.hr_profit)}</b></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </details>`;
        });

        let r_e = Math.floor((c_e/7)*2);
        let r_b = Math.floor((c_b/7)*2);
        let r_f = Math.floor((c_f/7)*2);
        let r_c = Math.floor((c_c/7)*2);

        html += `<div class="card text-muted" style="text-align:center;"><b>Kalan GÜNLÜK Demand:</b> ${r_e} E, ${r_b} B, ${r_f} F, ${r_c} C</div>`;
        
        resDiv.innerHTML = html;
    }
</script>
</body>
</html>
