<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airlines Manager Pro</title>
    <style>
        /* Modern ve Premium Renk Paleti (Tailwind Slate & Emerald tabanlı) */
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --input-bg: #334155;
            --accent: #3b82f6; /* Canlı Mavi */
            --danger: #f43f5e; /* Canlı Mercan Kırmızı */
            --success: #10b981; /* Zengin Yeşil */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 15px; margin: 0; padding-bottom: 50px; }
        h2, h3, h4 { margin-top: 0; color: #f8fafc; }
        
        /* Sekme Tasarımı */
        .tab-container { display: flex; margin-bottom: 20px; background-color: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .tab-btn { flex: 1; padding: 16px; text-align: center; background: none; border: none; color: var(--text-muted); font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background-color: var(--input-bg); color: var(--text-main); border-bottom: 4px solid var(--accent); }
        
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 18px; margin-bottom: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Esnek Grid Sistemi (Taşmaları önler) */
        .grid-flex { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 500;}
        input, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--input-bg); color: white; box-sizing: border-box; font-size: 16px; margin-bottom: 12px; font-family: inherit;}
        input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn-main { width: 100%; padding: 16px; border-radius: 10px; border: none; background-color: var(--accent); color: white; font-size: 17px; font-weight: bold; cursor: pointer; margin-top: 5px; margin-bottom: 25px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); transition: 0.2s;}
        .btn-main:active { transform: scale(0.98); background-color: #2563eb; }
        
        .btn-danger { background-color: var(--danger); box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4); }
        .btn-danger:active { background-color: #e11d48; }
        
        .btn-success { background-color: var(--success); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
        
        .btn-small { padding: 8px 12px; font-size: 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; color: white;}
        .bg-gray { background-color: var(--input-bg); border: 1px solid var(--border); }
        
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-muted { color: var(--text-muted); font-size: 14px; }
        .divider { border-bottom: 1px solid var(--border); margin: 18px 0; }
        
        /* Finansal Özet Kartı - Daha Vurgulu */
        .summary-box { text-align: center; padding: 18px; background-color: var(--input-bg); border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border);}
        .summary-box h4 { margin: 0 0 8px 0; color: var(--text-muted); font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px;}
        .summary-box h2 { margin: 0; font-size: 26px;}
        .daily-profit-highlight { font-size: 32px !important; color: var(--success); text-shadow: 0 2px 10px rgba(16, 185, 129, 0.3); }
        
        /* Açılır Kapanır Detaylar (Maximize Default) */
        details { background-color: var(--input-bg); border-radius: 10px; padding: 12px 18px; margin-bottom: 15px; border: 1px solid var(--border); }
        summary { font-weight: bold; font-size: 16px; cursor: pointer; outline: none; list-style: none;}
        summary::-webkit-details-marker { display: none; }
        .details-content { margin-top: 15px; font-size: 15px; border-top: 1px solid var(--border); padding-top: 15px;}
        .stat-list { list-style: none; padding: 0; margin: 0; }
        .stat-list li { margin-bottom: 10px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 5px;}
        .stat-list li:last-child { border-bottom: none; }
        
        /* Modal (Popup) Tasarımı */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px 0; }
        .modal-content { background-color: var(--bg-dark); width: 90%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        /* Hub ve Route Listesi Görünümü */
        .hub-header { display: flex; justify-content: space-between; align-items: center; background-color: var(--input-bg); padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--accent);}
        .route-item { background-color: var(--bg-dark); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .route-title { font-size: 18px; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>

    <div class="tab-container">
        <button class="tab-btn active" id="btn-tab-calc" onclick="switchTab('calc')">Hesaplayıcı</button>
        <button class="tab-btn" id="btn-tab-routes" onclick="switchTab('routes')">Rotalarım</button>
    </div>

    <div id="tab-calc">
        <div class="card">
            <h3>📍 Rota ve Konfor Bilgileri</h3>
            <div class="grid-2">
                <div><label>Uzaklık (km)</label><input type="number" id="dist" value="8000" oninput="saveData(); calcPrices();"></div>
                <div><label>Comfort İstatistiği</label><input type="number" id="comf" value="0" oninput="saveData(); calcPrices();"></div>
            </div>
            <div class="divider"></div>
            <h3>🏷️ Otomatik Bilet Fiyatları</h3>
            <div class="grid-flex">
                <div><label>Economy Class ($)</label><input type="number" id="p_e" readonly></div>
                <div><label>Business Class ($)</label><input type="number" id="p_b" readonly></div>
                <div><label>First Class ($)</label><input type="number" id="p_f" readonly></div>
                <div><label>Kargo ($)</label><input type="number" id="p_c" readonly></div>
            </div>
        </div>

        <div class="card">
            <h3>👥 Rota Brüt Yolcu Talebi (Günlük)</h3>
            <div class="grid-flex">
                <div><label>Economy Class</label><input type="number" id="d_e" value="0" oninput="saveData()"></div>
                <div><label>Business Class</label><input type="number" id="d_b" value="0" oninput="saveData()"></div>
                <div><label>First Class</label><input type="number" id="d_f" value="0" oninput="saveData()"></div>
                <div><label>Kargo (Ton)</label><input type="number" id="d_c" value="0" oninput="saveData()"></div>
            </div>
        </div>

        <button class="btn-main" onclick="calculate()">Uçak Konfigürasyonlarını Hesapla</button>
        <div id="results"></div>
    </div>

    <div id="tab-routes" style="display: none;">
        <button class="btn-main" onclick="openHubModal()" style="margin-bottom: 15px;">+ Yeni Hub (Merkez) Ekle</button>
        <div id="hubs-container"></div>
    </div>

    <div class="modal-overlay" id="modal-hub">
        <div class="modal-content">
            <h3 id="hub-modal-title">Hub Ekle</h3>
            <label>Hub Adı (Örn: IST, LAX)</label>
            <input type="text" id="hub-name-input" placeholder="Hub kodunu veya adını girin">
            <div class="grid-2" style="margin-top: 15px;">
                <button class="btn-small bg-gray" onclick="closeModal('modal-hub')">İptal</button>
                <button class="btn-small btn-success" onclick="saveHub()">Kaydet</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-route">
        <div class="modal-content">
            <h3 id="route-modal-title">Rota Ekle</h3>
            
            <label>Rota Adı (Örn: IST - JFK)</label>
            <input type="text" id="rt-name">
            
            <div class="grid-2">
                <div><label>Uzaklık (km)</label><input type="number" id="rt-dist"></div>
                <div><label>Net Günlük Kâr ($)</label><input type="number" id="rt-profit" placeholder="Oyun içi gerçek kâr"></div>
            </div>
            
            <div class="divider"></div>
            <h4>Bilet Fiyatları ($)</h4>
            <div class="grid-2">
                <div><label>Economy Class</label><input type="number" id="rt-price-e"></div>
                <div><label>Business Class</label><input type="number" id="rt-price-b"></div>
                <div><label>First Class</label><input type="number" id="rt-price-f"></div>
                <div><label>Kargo</label><input type="number" id="rt-price-c"></div>
            </div>

            <div class="divider"></div>
            <h4>Toplam Rota Talebi (Demand)</h4>
            <div class="grid-2">
                <div><label>Economy Demand</label><input type="number" id="rt-dem-e"></div>
                <div><label>Business Demand</label><input type="number" id="rt-dem-b"></div>
                <div><label>First Demand</label><input type="number" id="rt-dem-f"></div>
                <div><label>Kargo Demand</label><input type="number" id="rt-dem-c"></div>
            </div>
            
            <div class="divider"></div>
            <h4>Uçuş Sonrası Kalan Talep</h4>
            <div class="grid-2">
                <div><label>Kalan Economy</label><input type="number" id="rt-rem-e"></div>
                <div><label>Kalan Business</label><input type="number" id="rt-rem-b"></div>
                <div><label>Kalan First</label><input type="number" id="rt-rem-f"></div>
                <div><label>Kalan Kargo</label><input type="number" id="rt-rem-c"></div>
            </div>

            <div class="divider"></div>
            <label>Atanan Uçaklar ve Konfigürasyonları</label>
            <textarea id="rt-fleet" placeholder="Örn: 2x 777-300ER (550 Economy)&#10;1x 787-8 (200 Eco, 50 Bus)"></textarea>
            
            <div class="grid-2" style="margin-top: 15px;">
                <button class="btn-small bg-gray" onclick="closeModal('modal-route')">İptal Vazgeç</button>
                <button class="btn-small btn-success" onclick="saveRoute()">Rotayı Kaydet</button>
            </div>
        </div>
    </div>

<script>
    // --- HESAPLAYICI VERİTABANI VE MANTIK ---
    const AIRCRAFT_DB = [
        {name: "Airbus A380-800", range: 15556, speed: 903, seats: 853, cargo: 84, price: 403000000, fuel: 2.05, wear: 1.2, other: 0.10},
        {name: "Boeing 747-8I", range: 14815, speed: 911, seats: 605, cargo: 76, price: 379100000, fuel: 2.11, wear: 1.4, other: 0.12},
        {name: "Boeing 747-400", range: 13450, speed: 903, seats: 660, cargo: 65, price: 296300000, fuel: 2.65, wear: 2.1, other: 0.02},
        {name: "Boeing 777-300ER", range: 14685, speed: 898, seats: 550, cargo: 71, price: 330000000, fuel: 2.10, wear: 1.5, other: 0.08},
        {name: "Boeing 777-200ER", range: 14305, speed: 898, seats: 440, cargo: 59, price: 261500000, fuel: 2.40, wear: 1.8, other: 0.05},
        {name: "Airbus A350-1000", range: 14750, speed: 903, seats: 475, cargo: 54, price: 335000000, fuel: 1.65, wear: 1.1, other: 0.18},
        {name: "Airbus A350-900XWB", range: 15000, speed: 903, seats: 440, cargo: 45, price: 295200000, fuel: 1.70, wear: 1.1, other: 0.18},
        {name: "Boeing 787-9", range: 14140, speed: 911, seats: 420, cargo: 34, price: 264600000, fuel: 1.80, wear: 1.1, other: 0.18},
        {name: "Boeing 787-8", range: 13620, speed: 911, seats: 381, cargo: 28, price: 206800000, fuel: 1.85, wear: 1.1, other: 0.18},
        {name: "Airbus A330-900neo", range: 13334, speed: 880, seats: 440, cargo: 45, price: 272000000, fuel: 1.95, wear: 1.3, other: 0.15},
        {name: "Airbus A330-300", range: 11750, speed: 880, seats: 440, cargo: 45, price: 239400000, fuel: 2.30, wear: 1.8, other: 0.04},
        {name: "Boeing 767-300ER", range: 11070, speed: 850, seats: 350, cargo: 38, price: 182800000, fuel: 2.50, wear: 2.0, other: 0.01},
        {name: "Boeing 737-700ER", range: 10200, speed: 850, seats: 149, cargo: 15, price: 81000000, fuel: 2.60, wear: 1.7, other: 0.02},
        {name: "Airbus A310-300", range: 9540, speed: 850, seats: 275, cargo: 33, price: 157300000, fuel: 2.70, wear: 2.2, other: 0.01},
        {name: "Boeing 757-200", range: 7222, speed: 850, seats: 239, cargo: 25, price: 85000000, fuel: 2.55, wear: 1.9, other: 0.02},
        {name: "Airbus A321-200neo-LR", range: 7408, speed: 840, seats: 244, cargo: 5, price: 131500000, fuel: 1.90, wear: 1.2, other: 0.15},
        {name: "Boeing 737 MAX 9", range: 6574, speed: 839, seats: 220, cargo: 6, price: 116600000, fuel: 1.95, wear: 1.2, other: 0.15}
    ].sort((a, b) => b.seats - a.seats);

    const AVG_FUEL_PRICE = 750; 

    // Uygulama yüklendiğinde çalışacaklar
    window.onload = function() {
        // Hesaplayıcı verilerini yükle
        let hasData = false;
        ['dist', 'comf', 'd_e', 'd_b', 'd_f', 'd_c'].forEach(id => {
            if(localStorage.getItem(id) !== null) {
                document.getElementById(id).value = localStorage.getItem(id);
                hasData = true;
            }
        });
        calcPrices();
        if(hasData && parseFloat(document.getElementById('dist').value) > 0) calculate();
        
        // Rota Veritabanını yükle
        loadHubsData();
    };

    // --- SEKME YÖNETİMİ ---
    function switchTab(tabId) {
        document.getElementById('tab-calc').style.display = tabId === 'calc' ? 'block' : 'none';
        document.getElementById('tab-routes').style.display = tabId === 'routes' ? 'block' : 'none';
        
        document.getElementById('btn-tab-calc').classList.toggle('active', tabId === 'calc');
        document.getElementById('btn-tab-routes').classList.toggle('active', tabId === 'routes');
    }

    // --- HESAPLAYICI MANTIK ---
    function saveData() {
        ['dist', 'comf', 'd_e', 'd_b', 'd_f', 'd_c'].forEach(id => {
            localStorage.setItem(id, document.getElementById(id).value);
        });
    }

    function calcPrices() {
        let dist = parseFloat(document.getElementById('dist').value) || 0;
        let comf = parseFloat(document.getElementById('comf').value) || 0;
        let multi = 1 + (comf / 3000);
        document.getElementById('p_e').value = Math.floor(120 + (dist * 0.2639) * multi);
        document.getElementById('p_b').value = Math.floor(160 + (dist * 0.3509) * multi);
        document.getElementById('p_f').value = Math.floor(276 + (dist * 0.6068) * multi);
        let c_coef = dist >= 5000 ? 0.47 : (dist >= 2000 ? 0.52 : 0.56);
        document.getElementById('p_c').value = Math.floor(200 + (dist * c_coef));
    }

    function formatMoney(n) {
        return "$" + Math.round(n).toLocaleString('en-US');
    }

    function calculate() {
        saveData();
        let dist = parseFloat(document.getElementById('dist').value) || 0;
        let d_e = parseFloat(document.getElementById('d_e').value) || 0;
        let d_b = parseFloat(document.getElementById('d_b').value) || 0;
        let d_f = parseFloat(document.getElementById('d_f').value) || 0;
        let d_c = parseFloat(document.getElementById('d_c').value) || 0;

        let p_e = parseFloat(document.getElementById('p_e').value) || 0;
        let p_b = parseFloat(document.getElementById('p_b').value) || 0;
        let p_f = parseFloat(document.getElementById('p_f').value) || 0;
        let p_c = parseFloat(document.getElementById('p_c').value) || 0;

        let resDiv = document.getElementById('results');
        resDiv.innerHTML = "";

        let available = AIRCRAFT_DB.filter(p => p.range >= dist);
        if(available.length === 0) {
            resDiv.innerHTML = `<div class="card text-danger"><b>Hata:</b> ${dist} km menzile yetecek uçak veritabanında bulunamadı.</div>`;
            return;
        }

        let c_e = Math.ceil(d_e / 2) * 7;
        let c_b = Math.ceil(d_b / 2) * 7;
        let c_f = Math.ceil(d_f / 2) * 7;
        let c_c = Math.ceil(d_c / 2) * 7;

        let fleet = [];
        let cost = 0, gross_wk = 0, net_wk = 0;
        let loopSafe = 0;

        while(true) {
            loopSafe++; if(loopSafe > 50) break;
            
            let total_d = c_e + (c_b * 2) + (c_f * 4);
            if(total_d <= 0 && c_c <= 0) break;

            let chosen = null, chosen_flights = 1;

            for(let p of available) {
                let rt_time = (dist * 2) / p.speed || 1;
                let wk_flights = Math.max(1, Math.floor(168 / rt_time));
                if (p.seats * wk_flights <= total_d) {
                    chosen = p; chosen_flights = wk_flights; break;
                }
            }

            if(!chosen) {
                let p = available[available.length - 1];
                let rt_time = (dist * 2) / p.speed || 1;
                let wk_flights = Math.max(1, Math.floor(168 / rt_time));
                if (total_d < (p.seats * wk_flights) * 0.65) {
                    break;
                } else {
                    chosen = p; chosen_flights = wk_flights;
                }
            }

            let rem = chosen.seats;
            let conf = {name: chosen.name, E:0, B:0, F:0, C:0, flights: chosen_flights, stats: chosen};

            conf.F = Math.min(Math.ceil(c_f / chosen_flights), Math.floor(rem / 4));
            c_f = Math.max(0, c_f - (conf.F * chosen_flights));
            rem -= conf.F * 4;

            conf.B = Math.min(Math.ceil(c_b / chosen_flights), Math.floor(rem / 2));
            c_b = Math.max(0, c_b - (conf.B * chosen_flights));
            rem -= conf.B * 2;

            conf.E = Math.min(Math.ceil(c_e / chosen_flights), rem);
            c_e = Math.max(0, c_e - (conf.E * chosen_flights));
            rem -= conf.E;

            if(rem > 0) { conf.E += rem; c_e = Math.max(0, c_e - (rem * chosen_flights)); }

            conf.C = Math.min(Math.ceil(c_c / chosen_flights), chosen.cargo);
            c_c = Math.max(0, c_c - (conf.C * chosen_flights));

            let total_pax = conf.E + conf.B + conf.F;
            let rt_time = (dist * 2) / chosen.speed;
            let wk_hours = chosen_flights * rt_time;
            
            let wk_rev = ((conf.E*p_e) + (conf.B*p_b) + (conf.F*p_f) + (conf.C*p_c)) * chosen_flights;
            let fuel_cost = ((dist*2)/100) * chosen.fuel * total_pax * chosen_flights * (AVG_FUEL_PRICE/1000);
            let tax = chosen_flights * (dist >= 5000 ? 70000 : 40000);
            let other = wk_rev * chosen.other;
            let maint = (chosen.wear / 100) * (wk_hours / 100) * (chosen.price * 0.01);
            
            conf.wk_gross = wk_rev;
            conf.wk_net = wk_rev - fuel_cost - tax - other;
            
            conf.fuel_c = fuel_cost;
            conf.tax_c = tax + other;
            conf.maint_c = maint;
            conf.roi = conf.wk_net > 0 ? chosen.price / conf.wk_net : 0;
            
            cost += chosen.price;
            gross_wk += conf.wk_gross;
            net_wk += conf.wk_net;

            fleet.push(conf);
        }

        if(fleet.length === 0) {
            resDiv.innerHTML = `<div class="card text-muted">Atanacak yeterli yolcu kalmadı. Uçak ataması durduruldu.</div>`;
            return;
        }

        let gross_day = gross_wk / 7;
        let net_day = net_wk / 7;

        let html = `
        <div class="card">
            <div class="summary-box" style="border-color: var(--success); background-color: rgba(16, 185, 129, 0.05);">
                <h4>Oyun İçi Günlük Net Kâr</h4>
                <h2 class="daily-profit-highlight">${formatMoney(net_day)}</h2>
            </div>
            <div class="grid-2">
                <div class="summary-box">
                    <h4>Toplam Filo Maliyeti</h4>
                    <h2 class="text-danger" style="font-size:20px;">${formatMoney(cost)}</h2>
                </div>
                <div class="summary-box">
                    <h4>Günlük Brüt Gelir</h4>
                    <h2 style="font-size:20px; color:white;">${formatMoney(gross_day)}</h2>
                </div>
            </div>
            <div style="text-align:center; margin-top:5px; font-size:14px; color:var(--text-muted);">
                ⏱️ Ortalama Amortisman: <b>${(cost/net_wk).toFixed(1)} Hafta</b>
            </div>
        </div>`;

        fleet.forEach((f, i) => {
            html += `
            <details open>
                <summary>
                    <div>✈️ ${i+1}. Uçak: ${f.name}</div>
                </summary>
                
                <div class="details-content">
                    <div style="margin-bottom: 15px; font-size: 15px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px;">
                        <div><b>Uçak Fiyatı:</b> ${formatMoney(f.stats.price)}</div>
                        <div style="margin-top:5px;"><b>Haftalık Net Kâr:</b> <span class="text-success" style="font-weight:bold; font-size: 16px;">${formatMoney(f.wk_net)}</span></div>
                        <div style="margin-top:5px;"><b>Amortisman:</b> ${f.roi > 0 ? f.roi.toFixed(1) + ' Hafta' : '-'}</div>
                    </div>
                    
                    <div class="grid-2">
                        <div>
                            <span class="text-muted" style="display:block; margin-bottom:8px; border-bottom:1px solid #444; padding-bottom:4px;">💺 Konfigürasyon</span>
                            <ul class="stat-list">
                                <li><span>Economy Class</span> <b>${f.E}</b></li>
                                <li><span>Business Class</span> <b>${f.B}</b></li>
                                <li><span>First Class</span> <b>${f.F}</b></li>
                                <li><span>Kargo</span> <b>${f.C}</b></li>
                            </ul>
                        </div>
                        <div>
                            <span class="text-muted" style="display:block; margin-bottom:8px; border-bottom:1px solid #444; padding-bottom:4px;">💸 Giderler & Operasyon</span>
                            <ul class="stat-list">
                                <li><span>Haftalık Sefer</span> <b>${f.flights}</b></li>
                                <li><span>Haftalık Yakıt</span> <b>${formatMoney(f.fuel_c)}</b></li>
                                <li><span>Haftalık Vergi</span> <b>${formatMoney(f.tax_c)}</b></li>
                                <li><span>Haftalık Bakım</span> <b>${formatMoney(f.maint_c)}</b></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </details>`;
        });

        let r_e = Math.floor((c_e/7)*2);
        let r_b = Math.floor((c_b/7)*2);
        let r_f = Math.floor((c_f/7)*2);
        let r_c = Math.floor((c_c/7)*2);

        html += `<div class="card text-muted" style="text-align:center;"><b>Kalan Günlük Yolcu Talebi:</b> ${r_e} Economy, ${r_b} Business, ${r_f} First, ${r_c} Kargo</div>`;
        
        resDiv.innerHTML = html;
    }

    // --- ROTALARIM (VERİTABANI) MANTIĞI ---
    let myHubs = [];
    let editingHubId = null;
    let editingRouteId = null;

    function loadHubsData() {
        let stored = localStorage.getItem('am_hubs_db');
        if (stored) myHubs = JSON.parse(stored);
        renderHubs();
    }

    function saveHubsData() {
        localStorage.setItem('am_hubs_db', JSON.stringify(myHubs));
        renderHubs();
    }

    function renderHubs() {
        const container = document.getElementById('hubs-container');
        container.innerHTML = "";
        
        if (myHubs.length === 0) {
            container.innerHTML = `<div class="card text-muted" style="text-align:center;">Henüz eklenmiş bir Merkez (Hub) yok.</div>`;
            return;
        }

        myHubs.forEach(hub => {
            let html = `
            <div class="hub-header">
                <h3 style="margin:0;">🏢 ${hub.name}</h3>
                <div>
                    <button class="btn-small bg-gray" onclick="editHub(${hub.id})">✎</button>
                    <button class="btn-small btn-danger" onclick="deleteHub(${hub.id})">Sil</button>
                </div>
            </div>`;

            if(hub.routes && hub.routes.length > 0) {
                hub.routes.forEach(rt => {
                    html += `
                    <div class="route-item">
                        <div class="route-header">
                            <span class="route-title">📍 ${rt.name}</span>
                            <div>
                                <button class="btn-small bg-gray" onclick="openRouteModal(${hub.id}, ${rt.id})">Düzenle</button>
                                <button class="btn-small btn-danger" onclick="deleteRoute(${hub.id}, ${rt.id})">Sil</button>
                            </div>
                        </div>
                        <div class="grid-2 text-muted" style="margin-bottom: 10px;">
                            <div>Uzaklık: <b style="color:white">${rt.distance} km</b></div>
                            <div>Günlük Net Kâr: <b class="text-success">${formatMoney(rt.profit)}</b></div>
                        </div>
                        <details style="margin-bottom:0;">
                            <summary style="font-size:14px; font-weight:normal; padding-bottom:0;">Detayları ve Filoyu Görüntüle</summary>
                            <div class="details-content" style="padding-top:10px; margin-top:10px;">
                                <div class="grid-2">
                                    <ul class="stat-list">
                                        <li style="color:var(--text-muted)">Toplam Yolcu Talebi</li>
                                        <li>Eco: <b>${rt.demE}</b></li>
                                        <li>Bus: <b>${rt.demB}</b></li>
                                        <li>First: <b>${rt.demF}</b></li>
                                    </ul>
                                    <ul class="stat-list">
                                        <li style="color:var(--text-muted)">Kalan Yolcu Talebi</li>
                                        <li>Eco: <b>${rt.remE}</b></li>
                                        <li>Bus: <b>${rt.remB}</b></li>
                                        <li>First: <b>${rt.remF}</b></li>
                                    </ul>
                                </div>
                                <div class="divider" style="margin:10px 0;"></div>
                                <div style="white-space: pre-wrap; font-size:14px;"><b>Atanan Filo:</b><br>${rt.fleet}</div>
                            </div>
                        </details>
                    </div>`;
                });
            } else {
                html += `<div class="text-muted" style="padding: 10px; text-align:center;">Bu merkezde henüz rota yok.</div>`;
            }
            
            html += `<button class="btn-main" style="background-color:var(--input-bg); border:1px dashed var(--border); box-shadow:none; margin-bottom:30px;" onclick="openRouteModal(${hub.id}, null)">+ Bu Merkeze Rota Ekle</button>`;
            container.innerHTML += html;
        });
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- HUB İŞLEMLERİ ---
    function openHubModal() {
        editingHubId = null;
        document.getElementById('hub-modal-title').innerText = "Yeni Merkez (Hub) Ekle";
        document.getElementById('hub-name-input').value = "";
        openModal('modal-hub');
    }

    function editHub(id) {
        editingHubId = id;
        let hub = myHubs.find(h => h.id === id);
        document.getElementById('hub-modal-title').innerText = "Merkezi Düzenle";
        document.getElementById('hub-name-input').value = hub.name;
        openModal('modal-hub');
    }

    function saveHub() {
        let name = document.getElementById('hub-name-input').value.trim();
        if(!name) return alert("Lütfen bir isim girin.");
        
        if(editingHubId) {
            let hub = myHubs.find(h => h.id === editingHubId);
            hub.name = name;
        } else {
            myHubs.push({ id: Date.now(), name: name, routes: [] });
        }
        saveHubsData();
        closeModal('modal-hub');
    }

    function deleteHub(id) {
        if(confirm("Bu merkezi ve içindeki TÜM rotaları silmek istediğinize emin misiniz?")) {
            myHubs = myHubs.filter(h => h.id !== id);
            saveHubsData();
        }
    }

    // --- ROTA İŞLEMLERİ ---
    function openRouteModal(hubId, routeId) {
        editingHubId = hubId;
        editingRouteId = routeId;
        
        if (routeId) {
            document.getElementById('route-modal-title').innerText = "Rotayı Düzenle";
            let hub = myHubs.find(h => h.id === hubId);
            let rt = hub.routes.find(r => r.id === routeId);
            
            document.getElementById('rt-name').value = rt.name;
            document.getElementById('rt-dist').value = rt.distance;
            document.getElementById('rt-profit').value = rt.profit;
            document.getElementById('rt-price-e').value = rt.priceE;
            document.getElementById('rt-price-b').value = rt.priceB;
            document.getElementById('rt-price-f').value = rt.priceF;
            document.getElementById('rt-price-c').value = rt.priceC;
            document.getElementById('rt-dem-e').value = rt.demE;
            document.getElementById('rt-dem-b').value = rt.demB;
            document.getElementById('rt-dem-f').value = rt.demF;
            document.getElementById('rt-dem-c').value = rt.demC;
            document.getElementById('rt-rem-e').value = rt.remE;
            document.getElementById('rt-rem-b').value = rt.remB;
            document.getElementById('rt-rem-f').value = rt.remF;
            document.getElementById('rt-rem-c').value = rt.remC;
            document.getElementById('rt-fleet').value = rt.fleet;
        } else {
            document.getElementById('route-modal-title').innerText = "Yeni Rota Ekle";
            // Alanları Temizle
            ['rt-name', 'rt-dist', 'rt-profit', 'rt-price-e', 'rt-price-b', 'rt-price-f', 'rt-price-c', 'rt-dem-e', 'rt-dem-b', 'rt-dem-f', 'rt-dem-c', 'rt-rem-e', 'rt-rem-b', 'rt-rem-f', 'rt-rem-c', 'rt-fleet'].forEach(id => document.getElementById(id).value = "");
        }
        openModal('modal-route');
    }

    function saveRoute() {
        let name = document.getElementById('rt-name').value.trim();
        if(!name) return alert("Rota adı zorunludur.");
        
        let rtObj = {
            id: editingRouteId || Date.now(),
            name: name,
            distance: document.getElementById('rt-dist').value || 0,
            profit: document.getElementById('rt-profit').value || 0,
            priceE: document.getElementById('rt-price-e').value || 0,
            priceB: document.getElementById('rt-price-b').value || 0,
            priceF: document.getElementById('rt-price-f').value || 0,
            priceC: document.getElementById('rt-price-c').value || 0,
            demE: document.getElementById('rt-dem-e').value || 0,
            demB: document.getElementById('rt-dem-b').value || 0,
            demF: document.getElementById('rt-dem-f').value || 0,
            demC: document.getElementById('rt-dem-c').value || 0,
            remE: document.getElementById('rt-rem-e').value || 0,
            remB: document.getElementById('rt-rem-b').value || 0,
            remF: document.getElementById('rt-rem-f').value || 0,
            remC: document.getElementById('rt-rem-c').value || 0,
            fleet: document.getElementById('rt-fleet').value || ""
        };

        let hub = myHubs.find(h => h.id === editingHubId);
        
        if (editingRouteId) {
            let idx = hub.routes.findIndex(r => r.id === editingRouteId);
            hub.routes[idx] = rtObj;
        } else {
            hub.routes.push(rtObj);
        }
        
        saveHubsData();
        closeModal('modal-route');
    }

    function deleteRoute(hubId, routeId) {
        if(confirm("Bu rotayı silmek istediğinize emin misiniz?")) {
            let hub = myHubs.find(h => h.id === hubId);
            hub.routes = hub.routes.filter(r => r.id !== routeId);
            saveHubsData();
        }
    }
</script>
</body>
</html>
