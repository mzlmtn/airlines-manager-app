<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Airlines Manager Pro</title>
    <style>
        /* Daha Koyu ve Nötr Renk Paleti (Slate/Zinc) */
        :root {
            --bg-dark: #09090b;
            --card-bg: #18181b;
            --input-bg: #27272a;
            --accent: #10b981; /* Emerald Accent */
            --danger: #ef4444; /* Kırmızı Giderler */
            --success: #22c55e; /* Net Kar Yeşili */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border: #3f3f46;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 15px; margin: 0; padding-bottom: 50px; }
        h2, h3, h4 { margin-top: 0; color: #f4f4f5; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .refresh-btn { background: none; border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .refresh-btn:active { background: var(--input-bg); }

        /* Sekme Tasarımı */
        .tab-container { display: flex; margin-bottom: 20px; background-color: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border);}
        .tab-btn { flex: 1; padding: 14px; text-align: center; background: none; border: none; color: var(--text-muted); font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background-color: var(--input-bg); color: var(--text-main); border-bottom: 3px solid var(--accent); }
        
        .card { background-color: var(--card-bg); border-radius: 10px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
        
        .grid-flex { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 600;}
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); background-color: var(--input-bg); color: white; box-sizing: border-box; font-size: 15px; margin-bottom: 10px;}
        input:focus { outline: none; border-color: var(--accent); }
        
        .btn-main { width: 100%; padding: 14px; border-radius: 8px; border: none; background-color: var(--accent); color: #000; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 5px; margin-bottom: 20px; }
        .btn-main:active { opacity: 0.8; transform: scale(0.98); }
        
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-success { background-color: var(--success); color: black; }
        .btn-small { padding: 6px 12px; font-size: 13px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; color: white;}
        .bg-gray { background-color: var(--input-bg); border: 1px solid var(--text-muted); }
        
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-muted { color: var(--text-muted); font-size: 13px; }
        .divider { border-bottom: 1px solid var(--border); margin: 15px 0; }
        
        /* Finansal Özet Kartı */
        .summary-box { text-align: center; padding: 15px; background-color: var(--input-bg); border-radius: 8px; border: 1px solid var(--border);}
        .summary-box h4 { margin: 0 0 5px 0; color: var(--text-muted); font-size: 12px; text-transform: uppercase;}
        .summary-box h2 { margin: 0; font-size: 22px;}
        
        /* Açılır Kapanır Detaylar */
        details { background-color: var(--input-bg); border-radius: 8px; padding: 10px 15px; margin-bottom: 12px; border: 1px solid var(--border); }
        summary { font-weight: bold; font-size: 15px; cursor: pointer; outline: none; list-style: none;}
        summary::-webkit-details-marker { display: none; }
        .details-content { margin-top: 12px; font-size: 14px; border-top: 1px solid var(--border); padding-top: 12px;}
        .stat-list { list-style: none; padding: 0; margin: 0; }
        .stat-list li { margin-bottom: 8px; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border); padding-bottom: 4px;}
        .stat-list li:last-child { border-bottom: none; }
        
        /* Modal ve Navigation */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px 0; }
        .modal-content { background-color: var(--card-bg); width: 92%; max-width: 500px; border-radius: 10px; padding: 18px; border: 1px solid var(--border); }
        .back-btn { background: none; border: none; color: var(--accent); font-size: 15px; cursor: pointer; padding: 0; margin-bottom: 15px; font-weight: bold; display: flex; align-items: center; gap: 5px;}
        
        /* Liste Tasarımları */
        .list-item { background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item:active { opacity: 0.8; }
        .list-title { font-size: 16px; font-weight: bold; }
        .fleet-add-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 5px; margin-bottom: 10px; align-items: end;}
        .fleet-item { background: var(--bg-dark); padding: 8px; border-radius: 5px; font-size: 13px; display: flex; justify-content: space-between; margin-bottom: 5px; border: 1px solid var(--border);}
    </style>
</head>
<body>

    <div class="header-bar">
        <h2 style="margin: 0;">✈️ AM Pro</h2>
        <button class="refresh-btn" onclick="forceRefresh()">🔄 Yenile</button>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" id="btn-tab-calc" onclick="switchTab('calc')">Hesaplayıcı</button>
        <button class="tab-btn" id="btn-tab-routes" onclick="switchTab('routes')">Rotalarım</button>
    </div>

    <div id="tab-calc">
        <div class="card">
            <h3>📍 Rota ve Konfor</h3>
            <div class="grid-2">
                <div><label>Uzaklık (km)</label><input type="number" id="dist" value="8000" oninput="saveData(); calcPrices();"></div>
                <div><label>Comfort İstatistiği</label><input type="number" id="comf" value="0" oninput="saveData(); calcPrices();"></div>
            </div>
            <div class="divider"></div>
            <h3>🏷️ Bilet Fiyatları</h3>
            <div class="grid-flex">
                <div><label>Eco ($)</label><input type="number" id="p_e" readonly></div>
                <div><label>Bus ($)</label><input type="number" id="p_b" readonly></div>
                <div><label>First ($)</label><input type="number" id="p_f" readonly></div>
                <div><label>Kargo ($)</label><input type="number" id="p_c" readonly></div>
            </div>
        </div>

        <div class="card">
            <h3>👥 Brüt Günlük Talep</h3>
            <div class="grid-flex">
                <div><label>Eco</label><input type="number" id="d_e" value="0" oninput="saveData()"></div>
                <div><label>Bus</label><input type="number" id="d_b" value="0" oninput="saveData()"></div>
                <div><label>First</label><input type="number" id="d_f" value="0" oninput="saveData()"></div>
                <div><label>Kargo</label><input type="number" id="d_c" value="0" oninput="saveData()"></div>
            </div>
        </div>

        <button class="btn-main" onclick="calculate()">Optimize Et</button>
        <div id="results"></div>
    </div>

    <div id="tab-routes" style="display: none;">
        
        <div id="view-hubs">
            <button class="btn-main" style="padding: 12px; margin-bottom: 15px;" onclick="openHubModal()">+ Yeni Merkez (Hub) Ekle</button>
            <div id="hubs-container"></div>
        </div>

        <div id="view-routes" style="display: none;">
            <button class="back-btn" onclick="navTo('hubs')">⬅ Merkezlere Dön</button>
            <h3 id="current-hub-title" style="margin-bottom: 15px;"></h3>
            <button class="btn-main" style="padding: 10px; font-size:14px; background-color: var(--input-bg); border: 1px dashed var(--text-muted); color:white;" onclick="openRouteModal()">+ Rota Ekle</button>
            <div id="routes-container"></div>
        </div>

        <div id="view-route-details" style="display: none;">
            <button class="back-btn" onclick="navTo('routes')">⬅ Rotalara Dön</button>
            <div class="card" id="route-details-container"></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-hub">
        <div class="modal-content">
            <h3 id="hub-modal-title">Hub Ekle</h3>
            <label>Hub Adı (Örn: IST)</label>
            <input type="text" id="hub-name-input" placeholder="Hub kodunu girin">
            <div class="grid-2" style="margin-top: 15px;">
                <button class="btn-small bg-gray" onclick="closeModal('modal-hub')">İptal</button>
                <button class="btn-small btn-success" onclick="saveHub()">Kaydet</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-route">
        <div class="modal-content">
            <h3 id="route-modal-title">Rota Ekle</h3>
            <div class="grid-2">
                <div><label>Rota Adı (Örn: LHR)</label><input type="text" id="rt-name"></div>
                <div><label>Uzaklık (km)</label><input type="number" id="rt-dist"></div>
            </div>
            <div><label>Net Günlük Kâr ($)</label><input type="number" id="rt-profit"></div>
            
            <div class="divider"></div>
            <h4>Bilet Fiyatları ($)</h4>
            <div class="grid-4">
                <div><label>Eco</label><input type="number" id="rt-price-e"></div>
                <div><label>Bus</label><input type="number" id="rt-price-b"></div>
                <div><label>First</label><input type="number" id="rt-price-f"></div>
                <div><label>Cargo</label><input type="number" id="rt-price-c"></div>
            </div>

            <div class="divider"></div>
            <h4>Rota Toplam Talebi</h4>
            <div class="grid-4">
                <div><label>Eco</label><input type="number" id="rt-dem-e"></div>
                <div><label>Bus</label><input type="number" id="rt-dem-b"></div>
                <div><label>First</label><input type="number" id="rt-dem-f"></div>
                <div><label>Cargo</label><input type="number" id="rt-dem-c"></div>
            </div>

            <div class="divider"></div>
            <h4>Kalan Talep</h4>
            <div class="grid-4">
                <div><label>Eco</label><input type="number" id="rt-rem-e"></div>
                <div><label>Bus</label><input type="number" id="rt-rem-b"></div>
                <div><label>First</label><input type="number" id="rt-rem-f"></div>
                <div><label>Cargo</label><input type="number" id="rt-rem-c"></div>
            </div>

            <div class="divider"></div>
            <h4>Atanan Filo</h4>
            <div class="fleet-add-row">
                <div><label>Model</label><input type="text" id="tmp-name" placeholder="777"></div>
                <div><label>E</label><input type="number" id="tmp-e"></div>
                <div><label>B</label><input type="number" id="tmp-b"></div>
                <div><label>F</label><input type="number" id="tmp-f"></div>
                <div><label>C</label><input type="number" id="tmp-c"></div>
                <div><label>&nbsp;</label><button class="btn-small bg-gray" style="padding: 10px;" onclick="addTempFleet()">+</button></div>
            </div>
            <div id="temp-fleet-container" style="margin-bottom: 15px;"></div>
            
            <div class="grid-2">
                <button class="btn-small bg-gray" onclick="closeModal('modal-route')">İptal</button>
                <button class="btn-small btn-success" onclick="saveRoute()">Kaydet</button>
            </div>
        </div>
    </div>

<script>
    // Zorla Yenileme
    function forceRefresh() {
        window.location.reload(true);
    }

    const AIRCRAFT_DB = [
        {name: "Airbus A380-800", range: 15556, speed: 903, seats: 853, cargo: 84, price: 403000000, fuel: 2.05, wear: 1.2, other: 0.10},
        {name: "Boeing 747-8I", range: 14815, speed: 911, seats: 605, cargo: 76, price: 379100000, fuel: 2.11, wear: 1.4, other: 0.12},
        {name: "Boeing 747-400", range: 13450, speed: 903, seats: 660, cargo: 65, price: 296300000, fuel: 2.65, wear: 2.1, other: 0.02},
        {name: "Boeing 777-300ER", range: 14685, speed: 898, seats: 550, cargo: 71, price: 330000000, fuel: 2.10, wear: 1.5, other: 0.08},
        {name: "Boeing 777-200ER", range: 14305, speed: 898, seats: 440, cargo: 59, price: 261500000, fuel: 2.40, wear: 1.8, other: 0.05},
        {name: "Airbus A350-1000", range: 14750, speed: 903, seats: 475, cargo: 54, price: 335000000, fuel: 1.65, wear: 1.1, other: 0.18},
        {name: "Airbus A350-900XWB", range: 15000, speed: 903, seats: 440, cargo: 45, price: 295200000, fuel: 1.70, wear: 1.1, other: 0.18},
        {name: "Boeing 787-9", range: 14140, speed: 911, seats: 420, cargo: 34, price: 264600000, fuel: 1.80, wear: 1.1, other: 0.18},
        {name: "Boeing 787-8", range: 13620, speed: 911, seats: 381, cargo: 28, price: 206800000, fuel: 1.85, wear: 1.1, other: 0.18},
        {name: "Airbus A330-900neo", range: 13334, speed: 880, seats: 440, cargo: 45, price: 272000000, fuel: 1.95, wear: 1.3, other: 0.15},
        {name: "Airbus A330-300", range: 11750, speed: 880, seats: 440, cargo: 45, price: 239400000, fuel: 2.30, wear: 1.8, other: 0.04},
        {name: "Boeing 767-300ER", range: 11070, speed: 850, seats: 350, cargo: 38, price: 182800000, fuel: 2.50, wear: 2.0, other: 0.01},
        {name: "Boeing 737-700ER", range: 10200, speed: 850, seats: 149, cargo: 15, price: 81000000, fuel: 2.60, wear: 1.7, other: 0.02},
        {name: "Airbus A310-300", range: 9540, speed: 850, seats: 275, cargo: 33, price: 157300000, fuel: 2.70, wear: 2.2, other: 0.01},
        {name: "Boeing 757-200", range: 7222, speed: 850, seats: 239, cargo: 25, price: 85000000, fuel: 2.55, wear: 1.9, other: 0.02},
        {name: "Airbus A321-200neo-LR", range: 7408, speed: 840, seats: 244, cargo: 5, price: 131500000, fuel: 1.90, wear: 1.2, other: 0.15},
        {name: "Boeing 737 MAX 9", range: 6574, speed: 839, seats: 220, cargo: 6, price: 116600000, fuel: 1.95, wear: 1.2, other: 0.15}
    ].sort((a, b) => b.seats - a.seats);

    const AVG_FUEL_PRICE = 750;

    window.onload = function() {
        let hasData = false;
        ['dist', 'comf', 'd_e', 'd_b', 'd_f', 'd_c'].forEach(id => {
            if(localStorage.getItem(id) !== null) {
                document.getElementById(id).value = localStorage.getItem(id);
                hasData = true;
            }
        });
        calcPrices();
        if(hasData && parseFloat(document.getElementById('dist').value) > 0) calculate();
        loadHubsData();
    };

    function switchTab(tabId) {
        document.getElementById('tab-calc').style.display = tabId === 'calc' ? 'block' : 'none';
        document.getElementById('tab-routes').style.display = tabId === 'routes' ? 'block' : 'none';
        document.getElementById('btn-tab-calc').classList.toggle('active', tabId === 'calc');
        document.getElementById('btn-tab-routes').classList.toggle('active', tabId === 'routes');
    }

    function saveData() {
        ['dist', 'comf', 'd_e', 'd_b', 'd_f', 'd_c'].forEach(id => localStorage.setItem(id, document.getElementById(id).value));
    }

    function calcPrices() {
        let dist = parseFloat(document.getElementById('dist').value) || 0;
        let comf = parseFloat(document.getElementById('comf').value) || 0;
        let multi = 1 + (comf / 3000);
        document.getElementById('p_e').value = Math.floor(120 + (dist * 0.2639) * multi);
        document.getElementById('p_b').value = Math.floor(160 + (dist * 0.3509) * multi);
        document.getElementById('p_f').value = Math.floor(276 + (dist * 0.6068) * multi);
        document.getElementById('p_c').value = Math.floor(200 + (dist * (dist >= 5000 ? 0.47 : (dist >= 2000 ? 0.52 : 0.56))));
    }

    function formatMoney(n) { return "$" + Math.round(n).toLocaleString('en-US'); }

    function calculate() {
        saveData();
        let dist = parseFloat(document.getElementById('dist').value) || 0;
        let d_e = parseFloat(document.getElementById('d_e').value) || 0;
        let d_b = parseFloat(document.getElementById('d_b').value) || 0;
        let d_f = parseFloat(document.getElementById('d_f').value) || 0;
        let d_c = parseFloat(document.getElementById('d_c').value) || 0;

        let p_e = parseFloat(document.getElementById('p_e').value) || 0;
        let p_b = parseFloat(document.getElementById('p_b').value) || 0;
        let p_f = parseFloat(document.getElementById('p_f').value) || 0;
        let p_c = parseFloat(document.getElementById('p_c').value) || 0;

        let resDiv = document.getElementById('results');
        let available = AIRCRAFT_DB.filter(p => p.range >= dist);
        if(!available.length) return resDiv.innerHTML = `<div class="card text-danger"><b>Hata:</b> ${dist} km menzile yetecek uçak bulunamadı.</div>`;

        let c_e = Math.ceil(d_e / 2) * 7, c_b = Math.ceil(d_b / 2) * 7, c_f = Math.ceil(d_f / 2) * 7, c_c = Math.ceil(d_c / 2) * 7;
        let fleet = [], cost = 0, gross_wk = 0, net_wk = 0, loopSafe = 0;

        while(true) {
            if(++loopSafe > 50) break;
            let total_d = c_e + (c_b * 2) + (c_f * 4);
            if(total_d <= 0 && c_c <= 0) break;

            let chosen = null, chosen_flights = 1;
            for(let p of available) {
                let rt_time = (dist * 2) / p.speed || 1;
                let wk_flights = Math.max(1, Math.floor(168 / rt_time));
                if (p.seats * wk_flights <= total_d) { chosen = p; chosen_flights = wk_flights; break; }
            }

            if(!chosen) {
                let p = available[available.length - 1];
                let wk_flights = Math.max(1, Math.floor(168 / ((dist * 2) / p.speed || 1)));
                if (total_d < (p.seats * wk_flights) * 0.65) break;
                chosen = p; chosen_flights = wk_flights;
            }

            let rem = chosen.seats;
            let conf = {name: chosen.name, E:0, B:0, F:0, C:0, flights: chosen_flights, stats: chosen};

            conf.F = Math.min(Math.ceil(c_f / chosen_flights), Math.floor(rem / 4)); c_f = Math.max(0, c_f - (conf.F * chosen_flights)); rem -= conf.F * 4;
            conf.B = Math.min(Math.ceil(c_b / chosen_flights), Math.floor(rem / 2)); c_b = Math.max(0, c_b - (conf.B * chosen_flights)); rem -= conf.B * 2;
            conf.E = Math.min(Math.ceil(c_e / chosen_flights), rem); c_e = Math.max(0, c_e - (conf.E * chosen_flights)); rem -= conf.E;
            if(rem > 0) { conf.E += rem; c_e = Math.max(0, c_e - (rem * chosen_flights)); }
            conf.C = Math.min(Math.ceil(c_c / chosen_flights), chosen.cargo); c_c = Math.max(0, c_c - (conf.C * chosen_flights));

            let wk_rev = ((conf.E*p_e) + (conf.B*p_b) + (conf.F*p_f) + (conf.C*p_c)) * chosen_flights;
            let fuel_cost = ((dist*2)/100) * chosen.fuel * (conf.E + conf.B + conf.F) * chosen_flights * (AVG_FUEL_PRICE/1000);
            let tax = chosen_flights * (dist >= 5000 ? 70000 : 40000);
            let other = wk_rev * chosen.other;
            let maint = (chosen.wear / 100) * ((chosen_flights * ((dist*2)/chosen.speed)) / 100) * (chosen.price * 0.01);
            
            conf.wk_net = wk_rev - fuel_cost - tax - other;
            conf.fuel_c = fuel_cost; conf.tax_c = tax + other; conf.maint_c = maint;
            conf.roi = conf.wk_net > 0 ? chosen.price / conf.wk_net : 0;
            
            cost += chosen.price; gross_wk += wk_rev; net_wk += conf.wk_net;
            fleet.push(conf);
        }

        if(!fleet.length) return resDiv.innerHTML = `<div class="card text-muted">Atanacak yeterli demand yok.</div>`;

        let html = `
        <div class="card" style="padding: 0; overflow: hidden; border: 1px solid var(--border);">
            <div style="display: flex; text-align: center; background: var(--input-bg);">
                <div style="flex: 1; padding: 15px; border-right: 1px solid var(--border);">
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">GÜNLÜK BRÜT</div>
                    <div style="font-size: 20px; color: white; font-weight: bold;">${formatMoney(gross_wk/7)}</div>
                </div>
                <div style="flex: 1; padding: 15px;">
                    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 5px;">GÜNLÜK NET</div>
                    <div style="font-size: 20px; color: var(--success); font-weight: bold;">${formatMoney(net_wk/7)}</div>
                </div>
            </div>
            <div style="padding: 15px; background: var(--bg-dark);">
                <div class="grid-2" style="font-size: 13px; color: var(--text-muted);">
                    <div>⏱️ <b>Amortisman:</b> ${(cost/net_wk).toFixed(1)} Hft</div>
                    <div>📉 <b>Kalan Talep:</b> ${Math.floor((c_e/7)*2)} E, ${Math.floor((c_b/7)*2)} B, ${Math.floor((c_f/7)*2)} F</div>
                </div>
            </div>
        </div>`;

        fleet.forEach((f, i) => {
            html += `
            <details open>
                <summary>✈️ ${i+1}. Uçak: ${f.name}</summary>
                <div class="details-content">
                    <div class="grid-2">
                        <div>
                            <ul class="stat-list">
                                <li><span>Eco Koltuk</span> <b>${f.E}</b></li>
                                <li><span>Bus Koltuk</span> <b>${f.B}</b></li>
                                <li><span>First Koltuk</span> <b>${f.F}</b></li>
                                <li><span>Kargo Ton</span> <b>${f.C}</b></li>
                            </ul>
                        </div>
                        <div>
                            <ul class="stat-list">
                                <li><span class="text-danger">Yakıt Gideri</span> <b class="text-danger">-${formatMoney(f.fuel_c)}</b></li>
                                <li><span class="text-danger">Vergi Gideri</span> <b class="text-danger">-${formatMoney(f.tax_c)}</b></li>
                                <li><span class="text-danger">Bakım Gideri</span> <b class="text-danger">-${formatMoney(f.maint_c)}</b></li>
                                <li><span>Haftalık Sefer</span> <b>${f.flights}</b></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </details>`;
        });
        resDiv.innerHTML = html;
    }

    // --- ROTALARIM (VERİTABANI VE KADEMELİ GÖRÜNÜM) ---
    let db = { hubs: [] };
    let cHubId = null;
    let cRouteId = null;
    let tempFleetArray = [];

    function loadHubsData() {
        let stored = localStorage.getItem('am_hubs_v2');
        if (stored) db = JSON.parse(stored);
        renderHubsList();
    }
    function saveHubsData() { localStorage.setItem('am_hubs_v2', JSON.stringify(db)); }

    function navTo(view) {
        document.getElementById('view-hubs').style.display = view === 'hubs' ? 'block' : 'none';
        document.getElementById('view-routes').style.display = view === 'routes' ? 'block' : 'none';
        document.getElementById('view-route-details').style.display = view === 'details' ? 'block' : 'none';
        if(view === 'hubs') renderHubsList();
        if(view === 'routes') renderRoutesList();
    }

    // Katman 1: Hubs
    function renderHubsList() {
        let c = document.getElementById('hubs-container');
        c.innerHTML = "";
        db.hubs.forEach(h => {
            c.innerHTML += `
            <div class="list-item" onclick="openHub(${h.id})">
                <div class="list-title">🏢 ${h.name} <span class="text-muted">(${h.routes.length} Rota)</span></div>
                <div>
                    <button class="btn-small bg-gray" onclick="event.stopPropagation(); editHub(${h.id})">✎</button>
                    <button class="btn-small btn-danger" onclick="event.stopPropagation(); deleteHub(${h.id})">Sil</button>
                </div>
            </div>`;
        });
    }

    function openHub(id) { cHubId = id; document.getElementById('current-hub-title').innerText = "🏢 " + db.hubs.find(h=>h.id==id).name + " Rotaları"; navTo('routes'); }

    // Katman 2: Routes
    function renderRoutesList() {
        let hub = db.hubs.find(h => h.id === cHubId);
        let c = document.getElementById('routes-container');
        c.innerHTML = "";
        hub.routes.forEach(r => {
            c.innerHTML += `
            <div class="list-item" onclick="viewRoute(${r.id})">
                <div>
                    <div class="list-title" style="color:var(--accent);">📍 ${r.name || '-'}</div>
                    <div class="text-muted" style="margin-top:5px;">Kâr: <span class="text-success">${r.profit ? '$'+r.profit : '-'}</span></div>
                </div>
                <div>
                    <button class="btn-small bg-gray" onclick="event.stopPropagation(); openRouteModal(${r.id})">✎</button>
                    <button class="btn-small btn-danger" onclick="event.stopPropagation(); deleteRoute(${r.id})">Sil</button>
                </div>
            </div>`;
        });
    }

    // Katman 3: Route Details
    function viewRoute(id) {
        cRouteId = id;
        let r = db.hubs.find(h => h.id === cHubId).routes.find(r => r.id === id);
        let c = document.getElementById('route-details-container');
        
        let fleetHtml = (r.fleet && r.fleet.length > 0) ? r.fleet.map(f => `<li>${f.name} <span class="text-muted">(${f.e}E ${f.b}B ${f.f}F ${f.c}C)</span></li>`).join('') : '<li class="text-muted">Filo eklenmedi</li>';
        
        c.innerHTML = `
            <h3 style="color:var(--accent); margin-bottom:5px;">📍 ${r.name || '-'}</h3>
            <div style="font-size:18px; margin-bottom:15px;">Net Günlük: <b class="text-success">${r.profit ? '$'+r.profit : '-'}</b></div>
            
            <div class="grid-2">
                <div>
                    <span class="text-muted">Bilet Fiyatları</span>
                    <ul class="stat-list">
                        <li>Eco: <b>${r.pE || '-'}</b></li>
                        <li>Bus: <b>${r.pB || '-'}</b></li>
                        <li>First: <b>${r.pF || '-'}</b></li>
                    </ul>
                </div>
                <div>
                    <span class="text-muted">Kalan Talep</span>
                    <ul class="stat-list">
                        <li>Eco: <b>${r.rE || '-'}</b></li>
                        <li>Bus: <b>${r.rB || '-'}</b></li>
                        <li>First: <b>${r.rF || '-'}</b></li>
                    </ul>
                </div>
            </div>
            <div class="divider"></div>
            <span class="text-muted" style="display:block; margin-bottom:8px;">Atanan Filo</span>
            <ul class="stat-list">${fleetHtml}</ul>
        `;
        navTo('details');
    }

    // --- Modal Fonksiyonları ---
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openHubModal() { document.getElementById('hub-name-input').value = ""; cHubId = null; document.getElementById('hub-modal-title').innerText="Hub Ekle"; openModal('modal-hub'); }
    function editHub(id) { cHubId = id; document.getElementById('hub-name-input').value = db.hubs.find(h=>h.id==id).name; document.getElementById('hub-modal-title').innerText="Hub Düzenle"; openModal('modal-hub'); }
    
    function saveHub() {
        let n = document.getElementById('hub-name-input').value.trim();
        if(!n) return;
        if(cHubId) { db.hubs.find(h=>h.id==cHubId).name = n; } else { db.hubs.push({id: Date.now(), name: n, routes: []}); }
        saveHubsData(); renderHubsList(); closeModal('modal-hub');
    }
    
    function deleteHub(id) { if(confirm("Silinsin mi?")) { db.hubs = db.hubs.filter(h=>h.id!==id); saveHubsData(); renderHubsList(); } }

    function openRouteModal(id = null) {
        cRouteId = id;
        tempFleetArray = [];
        let r = {name:"", distance:"", profit:"", pE:"", pB:"", pF:"", pC:"", dE:"", dB:"", dF:"", dC:"", rE:"", rB:"", rF:"", rC:"", fleet:[]};
        if(id) {
            r = db.hubs.find(h => h.id === cHubId).routes.find(rt => rt.id === id);
            tempFleetArray = JSON.parse(JSON.stringify(r.fleet || []));
        }
        
        ['name','dist','profit','price-e','price-b','price-f','price-c','dem-e','dem-b','dem-f','dem-c','rem-e','rem-b','rem-f','rem-c'].forEach((f, i) => {
            let keys = ['name','distance','profit','pE','pB','pF','pC','dE','dB','dF','dC','rE','rB','rF','rC'];
            document.getElementById('rt-'+f).value = r[keys[i]] || "";
        });
        
        document.getElementById('route-modal-title').innerText = id ? "Rota Düzenle" : "Rota Ekle";
        renderTempFleet();
        openModal('modal-route');
    }

    function renderTempFleet() {
        let c = document.getElementById('temp-fleet-container');
        c.innerHTML = tempFleetArray.map((f, i) => `
            <div class="fleet-item">
                <div><b>${f.name}</b> <span class="text-muted">(${f.e}E ${f.b}B ${f.f}F ${f.c}C)</span></div>
                <button class="btn-small btn-danger" style="padding:4px 8px;" onclick="removeTempFleet(${i})">Sil</button>
            </div>
        `).join('');
    }

    function addTempFleet() {
        let n = document.getElementById('tmp-name').value || "Uçak";
        let e = document.getElementById('tmp-e').value || 0;
        let b = document.getElementById('tmp-b').value || 0;
        let f = document.getElementById('tmp-f').value || 0;
        let c = document.getElementById('tmp-c').value || 0;
        tempFleetArray.push({name:n, e:e, b:b, f:f, c:c});
        ['tmp-name','tmp-e','tmp-b','tmp-f','tmp-c'].forEach(id => document.getElementById(id).value = "");
        renderTempFleet();
    }
    function removeTempFleet(i) { tempFleetArray.splice(i, 1); renderTempFleet(); }

    function saveRoute() {
        let rObj = {
            id: cRouteId || Date.now(),
            fleet: tempFleetArray
        };
        ['name','dist','profit','price-e','price-b','price-f','price-c','dem-e','dem-b','dem-f','dem-c','rem-e','rem-b','rem-f','rem-c'].forEach((f, i) => {
            let keys = ['name','distance','profit','pE','pB','pF','pC','dE','dB','dF','dC','rE','rB','rF','rC'];
            rObj[keys[i]] = document.getElementById('rt-'+f).value;
        });

        let hub = db.hubs.find(h => h.id === cHubId);
        if(cRouteId) {
            let idx = hub.routes.findIndex(r => r.id === cRouteId);
            hub.routes[idx] = rObj;
        } else {
            hub.routes.push(rObj);
        }
        
        saveHubsData(); renderRoutesList(); closeModal('modal-route');
    }

    function deleteRoute(id) {
        if(confirm("Rota silinsin mi?")) {
            let hub = db.hubs.find(h => h.id === cHubId);
            hub.routes = hub.routes.filter(r => r.id !== id);
            saveHubsData(); renderRoutesList();
        }
    }
</script>
</body>
</html>
