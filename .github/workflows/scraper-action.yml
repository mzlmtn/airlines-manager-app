name: Airlines Manager Scraper

on:
  schedule:
    # Her gün Türkiye saatiyle yaklaşık 06:00'da çalışır (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel olarak butona basıp çalıştırmanızı sağlar

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Repoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        # Pandas'ın .xlsx oluşturabilmesi için openpyxl zorunludur
        pip install selenium beautifulsoup4 pandas openpyxl

    - name: 4. Scraper Kodunu Çalıştır
      env:
        # Kodun içindeki os.environ.get kısımları bu değişkenleri okur
        AIRLINES_USER: ${{ secrets.AIRLINES_USER }}
        AIRLINES_PASS: ${{ secrets.AIRLINES_PASS }}
      run: python my_aircrafts_scraper.py

    - name: 5. Oluşan Excel Dosyasını Repoya Kaydet
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # Sadece kodun ürettiği xlsx dosyasını ekliyoruz
        git add aircrafts_output.xlsx
        git commit -m "Otomatik Güncelleme: aircrafts_output.xlsx" || echo "Değişiklik yok, commit atlanıyor."
        git push
