name: Airlines Manager Scraper

on:
  schedule:
    # 05:15 TRT = 02:15 UTC
    - cron: '15 2 * * *'

    # 15:30 TRT = 12:30 UTC
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Repoyu Klonla
      uses: actions/checkout@v4

    - name: 2. Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 3. Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install selenium beautifulsoup4 pandas openpyxl

    - name: 4. Eski Excel Dosyalarını Sil (KRİTİK EKLEME)
      run: |
        echo "Eski Excel dosyaları siliniyor..."
        rm -f *.xlsx

    - name: 5. Uçaklar (Aircrafts) Scraper Kodunu Çalıştır
      env:
        AIRLINES_USER: ${{ secrets.AIRLINES_USER }}
        AIRLINES_PASS: ${{ secrets.AIRLINES_PASS }}
      run: python my_aircrafts_scraper.py

    - name: 6. Rotalar (Routes) Scraper Kodunu Çalıştır
      env:
        AIRLINES_USER: ${{ secrets.AIRLINES_USER }}
        AIRLINES_PASS: ${{ secrets.AIRLINES_PASS }}
      run: python my_routes_scraper.py

    - name: 7. Yeni Excel Dosyalarını Repoya Kaydet
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Sadece yeni oluşan dosyaları ekle
        git add *.xlsx

        # Değişiklik varsa commit at
        git commit -m "Otomatik Güncelleme: Uçak ve Rota Excel verileri güncellendi" || echo "Değişiklik yok, commit atlanıyor."

        git push